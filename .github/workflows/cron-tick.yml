name: Autopilot tick

on:
  schedule:
    # Toutes les 5 min : le moniteur externe (cron-job.org) n'est pas fiable.
    # GitHub Actions retarde parfois le cron de quelques minutes — suffisant.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/tick
        run: |
          curl -fsS --max-time 280 \
            "https://gosite.digital/api/cron/tick?key=${{ secrets.TICK_SECRET }}"
